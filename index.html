<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator with History</title>

<style>
body {
  margin: 0;
  background: linear-gradient(135deg, #667eea, #764ba2);
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  display: flex;
  gap: 15px;
}

.calculator {
  background: #1e1e1e;
  padding: 15px;
  border-radius: 15px;
  width: 260px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

#display {
  width: 100%;
  height: 50px;
  font-size: 24px;
  text-align: right;
  padding-right: 10px;
  border: none;
  border-radius: 10px;
  margin-bottom: 10px;
}
  #voiceBtn {
  width: 100%;
  height: 45px;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  border: none;
  border-radius: 12px;
  font-size: 18px;
  color: white;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  transition: all 0.3s ease;
}

/* Hover effect */
#voiceBtn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

/* Active / pressed effect */
#voiceBtn:active {
  transform: translateY(1px);
  box-shadow: 0 3px 10px rgba(0,0,0,0.2);
}
  @keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,154,158, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(255,154,158, 0); }
  100% { box-shadow: 0 0 0 0 rgba(255,154,158, 0); }
}

#voiceBtn.active {
  animation: pulse 1s infinite;
}
button {
  width: 55px;
  height: 50px;
  margin: 3px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.num { background: #333; color: white; }
.op { background: #ff9500; color: white; }
.eq { background: #34c759; color: white; width: 115px; }
.clear { background: #ff3b30; color: white; }

.history {
  background: white;
  border-radius: 15px;
  width: 180px;
  padding: 10px;
  overflow-y: auto;
  max-height: 360px;
}

.history h3 {
  margin-top: 0;
  text-align: center;
}

.history p {
  margin: 5px 0;
  font-size: 14px;
} 
  /* Theme Button */
#themeBtn {
  width: 100%;
  height: 35px;
  margin-bottom: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
}

/* Light Mode */
body.light {
  background: #f2f2f2;
}

body.light .calculator {
  background: #ffffff;
}

body.light #display {
  background: #f0f0f0;
  color: black;
}

body.light .num {
  background: #e0e0e0;
  color: black;
}

body.light .op {
  background: #007aff;
  color: white;
}

body.light .clear {
  background: #ff3b30;
  color: white;
}

body.light .eq {
  background: #34c759;
  color: white;
}
  
</style>
</head>

<body>

<div class="container">

  <div class="calculator">
    <input type="text" id="display" readonly>
    <button id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
    <button id="voiceBtn" onclick="startVoice()">🎤 Speak</button>
    <button id="stopVoice">Voice Stop</button>
    

    
    <div>
  <button class="clear" onclick="clearAll()">C</button>
  <button class="clear" onclick="del()">DEL</button>
  <button class="op" onclick="sqrt()">√</button>
 <button class="op" onclick="calcSin()">sin</button>
<button class="op" onclick="calcCos()">cos</button>
<button class="op" onclick="calcTan()">tan</button>
      
  <button class="op" onclick="add('/')">/</button>
  <button class="op" onclick="add('*')">*</button>
    </div>
    


    <div>
      <button class="num" onclick="add('7')">7</button>
      <button class="num" onclick="add('8')">8</button>
      <button class="num" onclick="add('9')">9</button>
      <button class="op" onclick="add('-')">-</button>
    </div>

    <div>
      <button class="num" onclick="add('4')">4</button>
      <button class="num" onclick="add('5')">5</button>
      <button class="num" onclick="add('6')">6</button>
      <button class="op" onclick="add('+')">+</button>
    </div>

    <div>
      <button class="num" onclick="add('1')">1</button>
      <button class="num" onclick="add('2')">2</button>
      <button class="num" onclick="add('3')">3</button>
      <button class="eq" onclick="calculate()">=</button>
    </div>

    <div>
      <button class="num" onclick="add('0')">0</button>
      <button class="num" onclick="add('.')">.</button>
    </div>
  </div>

  <div class="history">
    <h3>History</h3>
    <button class="clear" onclick="clearHistory()">Clear History</button>
    <div id="historyList"></div>
  </div>

</div>

<script>
  function calcSin() {
  let value = eval(display.value);
  let result = Math.sin(value * Math.PI / 180);
  display.value = result;
  saveHistory("sin(" + value + ") = " + result);
}

function calcCos() {
  let value = eval(display.value);
  let result = Math.cos(value * Math.PI / 180);
  display.value = result;
  saveHistory("cos(" + value + ") = " + result);
}

function calcTan() {
  let value = eval(display.value);
  let result = Math.tan(value * Math.PI / 180);
  display.value = result;
  saveHistory("tan(" + value + ") = " + result);
  }
  
let display = document.getElementById("display");
let historyList = document.getElementById("historyList");

function add(val) {
  display.value += val;
}

function clearAll() {
  display.value = "";
}

function del() {
  display.value = display.value.slice(0, -1);
}

function calculate() {
  try {
    let expression = display.value;
    let result = eval(expression);
    display.value = result;

    saveHistory(expression + " = " + result);
  } catch {
    display.value = "Error";
  }
}
  function sqrt() {
   try {
    let value = eval(display.value);
    let result = Math.sqrt(value);
    display.value = result;
    saveHistory("√(" + value + ") = " + result);
  } catch {
    display.value = "Error";
  }
  }
  

function saveHistory(entry) {
  let history = JSON.parse(localStorage.getItem("calcHistory")) || [];
  history.unshift(entry);
  localStorage.setItem("calcHistory", JSON.stringify(history));
  showHistory();
  }
  // 🎤 VOICE RECOGNITION FIXED

var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
var recognition = new SpeechRecognition();

recognition.lang = "en-US";
recognition.continuous = false;

recognition.onresult = function(event) {

  let speech = event.results[0][0].transcript.toLowerCase();

  speech = speech
    .replace(/plus/g, "+")
    .replace(/minus/g, "-")
    .replace(/multiply|multiplied by/g, "*")
    .replace(/divide|divided by/g, "/")
    .replace(/zero/g,"0")
    .replace(/one/g,"1")
    .replace(/two/g,"2")
    .replace(/three/g,"3")
    .replace(/four/g,"4")
    .replace(/five/g,"5")
    .replace(/six/g,"6")
    .replace(/seven/g,"7")
    .replace(/eight/g,"8")
    .replace(/nine/g,"9");

  display.value = speech;
};

function startVoice() {
  recognition.start();
}

function stopVoice() {
  recognition.stop();
}

document.getElementById("stopVoice").addEventListener("click", stopVoice);
  ("click", function() {
  stopVoice();
  alert("Voice input stopped ✅");
});
  
function showHistory() {
  historyList.innerHTML = "";
  let history = JSON.parse(localStorage.getItem("calcHistory")) || [];
  history.forEach(item => {
    let p = document.createElement("p");
    p.textContent = item;
    historyList.appendChild(p);
  });
}

showHistory();
  function clearHistory() {
  localStorage.removeItem("calcHistory");
  historyList.innerHTML = "";
  }
  
  showHistory();
function toggleTheme() {
  document.body.classList.toggle("light");

  let btn = document.getElementById("themeBtn");
  if (document.body.classList.contains("light")) {
    btn.innerText = "🌞 Light";
    localStorage.setItem("theme", "light");
  } else {
    btn.innerText = "🌙 Dark";
    localStorage.setItem("theme", "dark");
  }
}
  
document.addEventListener("keydown", function (e) {

  if (e.key >= "0" && e.key <= "9") add(e.key);

  if (e.key === "+") add("+");
  if (e.key === "-") add("-");
  if (e.key === "*") add("*");
  if (e.key === "/") add("/");

  if (e.key === ".") add(".");

  if (e.key === "Enter") {
    e.preventDefault();
    calculate();
  }

  if (e.key === "Backspace") del();

  if (e.key === "Delete") clearAll();

  if (e.key === "r" || e.key === "R") sqrt();
    if (e.key === "s" || e.key === "S") calcSin();
  if (e.key === "c" || e.key === "C") calcCos();
  if (e.key === "t" || e.key === "T") calcTan();
  
});
  
</script>
  
</script>

</body>
</html>
